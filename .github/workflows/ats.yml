name: Scrape Direct ATS Endpoints

on:
  schedule:
    - cron: '0 4,16 * * *'  # 04:00 and 16:00 UTC (12:00 AM / 12:00 PM EDT) — twice daily direct ATS polling
  workflow_dispatch:          # manual trigger from GitHub UI

concurrency:
  group: scrape-ats
  cancel-in-progress: false

jobs:
  scrape-ats:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # push run-health log to the run-logs branch
    timeout-minutes: 120      # 42 endpoints + scoring + push ≈ 20–40 min; generous buffer

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ATS scraper + score + push to Notion
        env:
          PYTHONUNBUFFERED: "1"
          NOTION_TOKEN:           ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID:           ${{ secrets.NOTION_DB_ID }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          FETCH_DESCRIPTION_KEY:  ${{ secrets.FETCH_DESCRIPTION_KEY }}
          RESUME_FOLDER_ID:       ${{ secrets.RESUME_FOLDER_ID }}
          SLACK_WEBHOOK_URL:      ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python run_ats.py

      - name: Upload run-health log (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-health-ats-${{ github.run_id }}
          path: logs/run_health.jsonl
          if-no-files-found: ignore
          retention-days: 90

      - name: Push run-health log to run-logs branch
        if: always()
        continue-on-error: true
        run: bash scripts/push_run_log.sh
