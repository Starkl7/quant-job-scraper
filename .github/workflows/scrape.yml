name: Scrape LinkedIn + Indeed (JobSpy)

on:
  schedule:
    - cron: '0 6 * * *'     # 06:00 UTC daily (02:00 ET / 11:00 IST)
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  scrape-jobspy:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # 54 queries × ~30s each ≈ 27 min; buffer for scoring + retry pass

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run JobSpy scraper + score + push to Notion
        env:
          PYTHONUNBUFFERED: "1"
          NOTION_TOKEN:           ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID:           ${{ secrets.NOTION_DB_ID }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          FETCH_DESCRIPTION_KEY:  ${{ secrets.FETCH_DESCRIPTION_KEY }}
          RESUME_FOLDER_ID:         ${{ secrets.RESUME_FOLDER_ID }}
          RESUME_FOLDER_ID_DHRUBO:  ${{ secrets.RESUME_FOLDER_ID_DHRUBO }}
          RESUME_FOLDER_ID_SHREYANSH: ${{ secrets.RESUME_FOLDER_ID_SHREYANSH }}
          SLACK_WEBHOOK_URL:      ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python run_jobspy.py
