name: Scrape Google Jobs (SerpAPI)

on:
  schedule:
    - cron: '0 23 * * *'    # 23:00 UTC daily — captures the full day's listings
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  scrape-serpapi:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # 4 terms × 4 cities × scoring ≈ 20–40 min; buffer to 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SerpAPI scraper + score + push to Notion
        env:
          PYTHONUNBUFFERED: "1"
          NOTION_TOKEN:           ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID:           ${{ secrets.NOTION_DB_ID }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          FETCH_DESCRIPTION_KEY:  ${{ secrets.FETCH_DESCRIPTION_KEY }}
          RESUME_FOLDER_ID:         ${{ secrets.RESUME_FOLDER_ID }}
          RESUME_FOLDER_ID_DHRUBO:  ${{ secrets.RESUME_FOLDER_ID_DHRUBO }}
          RESUME_FOLDER_ID_SHREYANSH: ${{ secrets.RESUME_FOLDER_ID_SHREYANSH }}
          SERPAPI_KEY_1:          ${{ secrets.SERPAPI_KEY_1 }}
          SERPAPI_KEY_2:          ${{ secrets.SERPAPI_KEY_2 }}
          SLACK_WEBHOOK_URL:      ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python run_serpapi.py
